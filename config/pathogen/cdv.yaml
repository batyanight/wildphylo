# =============================================================================
# CDV — canine distemper virus (Morbillivirus canis)
#
# This is the reference implementation: the analysis the pipeline was built
# from. Every value here was hardcoded in a script before. Copy
# config/pathogen/_template.yaml to start a new pathogen.
# =============================================================================

id: cdv
name: Canine distemper virus
scientific_name: Morbillivirus canis

# Virus class. Drives which checks are mandatory: segmented genomes need
# per-segment alignment and reassortment screening; recombining families need a
# recombination test before any clock is fitted, because unrecognised
# recombination inflates rate estimates and can manufacture a false clock.
virus:
  genome: ssRNA-negative        # ssRNA-positive | ssRNA-negative | dsRNA | ssDNA | dsDNA | retro
  segmented: false
  n_segments: 1
  recombination_expected: false   # true -> recombination screen becomes a hard gate
  # Order-of-magnitude expected rate for this genome class, subs/site/yr.
  # Used only to sanity-check clock_rate_prior, never as the prior itself.
  expected_rate_range: [1.0e-4, 1.0e-2]

# --- what to fetch ----------------------------------------------------------
fetch:
  taxid: 11232
  # Appended to the taxid clause. Keep exclusions here rather than in code so
  # the provenance record shows exactly what was asked for.
  query_filter: >-
    NOT patent[Properties]
  min_length: 400
  max_length: 20000
  batch_size: 200

# --- the locus under analysis ----------------------------------------------
# GenBank annotates the same gene under many names. List every spelling you
# have actually observed; unmatched records go to needs_review, not the bin.
locus:
  name: H
  product: hemagglutinin
  aliases: [H, HA, hemagglutinin, haemagglutinin, hemaglutinin, "H protein", "HA gene"]
  # Length window for the fallback heuristic used when a record has no usable
  # feature annotation. Full-length CDV H is 1824 nt.
  expected_length: 1824
  min_usable_length: 400
  length_tolerance: 0.15
  # Coordinate reference. Every annotation position is expressed in this
  # sequence's numbering, not in alignment columns — alignment columns shift
  # whenever the dataset changes.
  coordinate_reference:
    accession: AF164967
    strain: A75/17
    lineage: America-2
    cds: [21, 1836]

# --- date handling ----------------------------------------------------------
dates:
  # Nothing before this is a plausible collection date for this pathogen.
  # Sequences predating the sequencing era are data-entry errors.
  min_year: 1970
  max_year: null          # null = current year + 1
  # Year-only dates are the majority here. 'interval' samples the tip date
  # within its uncertainty window rather than fixing it at the midpoint.
  imprecise_date_policy: interval   # midpoint | interval | exclude

# --- host normalisation -----------------------------------------------------
hosts:
  table: config/host_groups.tsv
  # Groups considered wild for the purposes of subsampling and reporting.
  # This was a hardcoded set inside 06_subsample.py.
  wild_groups: [wild_felid, wild_canid, mustelid, procyonid, ailurid, ursid, viverrid]
  reservoir_candidates: [procyonid]
  min_group_size: 5       # warn below this; a singleton group cannot inform a rate

  # Discrete-trait states. The host table defines 12 functional groups, which
  # would give 66 symmetric transition rates -- far more than the number of
  # observed host transitions can identify, which is why 8 of 10 rates in the
  # published clade-3 run were indistinguishable from the mean and the root
  # state sat at p = 0.25.
  #
  # This map makes the collapse an explicit, reviewable decision rather than an
  # emergent side effect of which sequences happened to land in the subset.
  # Groups not listed here are pooled into `dta_other`; set that to null to
  # exclude them from the trait analysis instead.
  dta_states:
    procyonid:    procyonid
    wild_canid:   wild_canid
    mustelid:     mustelid
    wild_felid:   felid
    domestic_cat: felid
    domestic_dog: domestic_dog
  dta_other: null          # null = exclude unmapped groups; or a state name to pool them

# --- exclusions -------------------------------------------------------------
exclude:
  vaccine_patterns_file: config/vaccine_strains.txt
  lab_passaged: true

# --- reference sequences for lineage assignment -----------------------------
references:
  table: config/lineage_references.tsv
  expected_lineages:
    - America-1
    - America-2
    - Asia-1
    - Asia-2
    - Asia-3
    - Asia-4
    - Europe
    - Europe-Wildlife
    - Arctic-like
    - Africa-1
    - South-America-1

# --- alignment and ML tree --------------------------------------------------
alignment:
  aligner: mafft
  mafft_args: "--auto --reorder"
  trim: false
  max_gap_fraction: 0.60      # per-sequence; above this, flag for review
  max_ambiguity_fraction: 0.05
  min_identity_to_consensus: 0.80

tree:
  method: iqtree
  model: MFP                  # ModelFinder; set explicitly to pin a model
  ufboot: 1000
  alrt: 1000
  threads: AUTO

# --- temporal signal gate ---------------------------------------------------
# This gate decides whether the Bayesian step runs. Thresholds are tripwires,
# not significance tests.
temporal_signal:
  min_r_squared: 0.10
  min_span_years: 5.0
  permutations: 1000
  max_concentration: 0.75     # fraction of tips allowed in one 10-year window
  on_fail: stop               # stop | warn
  on_weak: warn

# --- Bayesian phylodynamics -------------------------------------------------
beast:
  # The clock prior. Do NOT copy this to another pathogen: it is a
  # morbillivirus H-gene rate. For a new taxon, leave clock_rate_prior null and
  # the workflow will centre the prior on the root-to-tip slope estimated from
  # your own data, with a wide enough sd to stay uninformative.
  clock_rate_prior: 7.46e-4
  clock_rate_source: "Panzera et al., CDV H gene; corroborated by root-to-tip"
  clock_model: relaxed_lognormal        # strict | relaxed_lognormal | relaxed_exponential
  substitution_model: HKY+G4
  tree_prior: coalescent_constant       # coalescent_constant | coalescent_skyline | birth_death
  chain_length: 100000000
  n_chains: 2
  seeds: [12345, 54321]
  burnin_fraction: 0.10
  min_ess: 200
  # Discrete trait (ancestral state) reconstruction.
  discrete_trait:
    enabled: true
    trait: host_group
    symmetric: true          # false gives directional rates; needs more data
    bssvs: true

  # Date-randomisation test — the formal temporal signal check.
  date_randomisation:
    enabled: true
    replicates: 20
    chain_length: 20000000

# --- subsampling ------------------------------------------------------------
subsample:
  target_tips: 400
  year_bin: 5
  seed: 12345
  strata: [clade, host_group, year_bin]

# --- Nextstrain build -------------------------------------------------------
nextstrain:
  title: "CDV America-2 lineage in North American carnivores"
  maintainer: "Batya Nightingale"
  build_name: cdv-phylodynamics
  colour_by: [host_group, country, lineage]
  geo_resolutions: [country]
  # Periodic rebuilds. Each run is date-stamped and the previous build is kept,
  # so a changed conclusion can be traced to the records that changed.
  update:
    # Cron cadence, but the build only proceeds if GenBank actually has new
    # records. A rebuild that re-analyses an unchanged dataset burns days of
    # compute and produces a second, confusingly-dated copy of the same result.
    schedule: monthly
    trigger: accession_delta      # always | accession_delta
    min_new_accessions: 5         # below this, log and skip the rebuild
    # A large jump is as suspicious as none: it usually means the query changed
    # or a bulk submission landed, both of which warrant eyes before compute.
    max_new_accessions: 500
    keep_builds: 12
    # Refuse to publish if the new fetch lost sequences or the TMRCA moves
    # more than this much — that signals a curation regression, not a finding.
    alert_on_tmrca_shift_years: 5.0
    alert_on_sequence_loss: true
