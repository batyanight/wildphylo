[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildphylo"
version = "0.3.0"
description = "Config-driven phylodynamics pipeline for wildlife disease"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["biopython>=1.83", "pandas>=2.2", "numpy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "snakemake>=8", "mypy>=1.10", "ruff>=0.16,<0.17"]

[project.scripts]
wildphylo = "wildphylo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The Snakefile ships inside the package. A pathogen repo pins wildphylo by
# tag and its wrapper Snakefile includes this one, so a wheel without it gives
# a working CLI and no pipeline. See wildphylo.workflow_path().
[tool.setuptools.package-data]
wildphylo = ["workflow/Snakefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a second (deselect with -m 'not slow')",
  "needs_tools: requires mafft/iqtree/beast on PATH",
]

[tool.ruff]
line-length = 99
target-version = "py311"
preview = false
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# One line of justification per ignored rule. Remove the rule from this list
# when the justification stops holding.
ignore = [
  "COM812",   # trailing commas: conflicts with the formatter
  "CPY001",   # no per-file copyright headers; LICENSE covers the repo
  "D1",       # undocumented public objects: enforced per stage as each is ported (see per-file-ignores)
  "DTZ",      # build dates are deliberately local wall-clock dates, not instants
  "EM101", "EM102", "TRY003",  # exception-message style; no correctness value
  "FBT",      # boolean positional flags are idiomatic in these small CLIs
  "N806",     # scientific names (R2, N, Ne) are clearer than lowercase forms
  "PLC0415",  # imports inside functions keep heavy optional deps (matplotlib, Bio) lazy
  "PLR2004",  # thresholds and tolerances in scientific code are not magic numbers
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # complexity: addressed by the stage refactor, not by lint
  "S311",     # random is used for subsampling and permutation tests, not security
  "S603", "S607",  # subprocess runs known tools with list args; shell=False everywhere
  "S314",     # ElementTree parses XML this pipeline generated itself
  "ANN202", "ANN401",  # private return types and Any are allowed
  "TD", "FIX",  # TODO comments are tracked in docs/PLAN-stages.md, not by lint
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "S101", "INP001", "T201", "PT018"]
"tests/fixtures/*" = ["ALL"]
# BEAST XML templates are f-strings whose lines must stay verbatim: wrapping
# them would change the generated XML.
"src/wildphylo/beastxml.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/wildphylo"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["Bio.*", "pandas.*", "matplotlib.*", "scipy.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wildphylo.segments"]
# Bio.Phylo's tree methods (get_terminals, distance) ship without annotations.
disallow_untyped_calls = false
