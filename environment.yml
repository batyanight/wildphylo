name: wildphylo
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  # core
  - biopython>=1.83
  - pandas>=2.2
  - numpy
  - matplotlib
  - pyyaml
  # workflow
  - snakemake>=8
  # alignment and ML trees
  - mafft>=7.520
  # bioconda ships IQ-TREE as `iqtree` (which may be v1, v2 or v3 depending on
  # the build) and separately as `iqtree2`/`iqtree3`. The workflow resolves
  # whichever binary is present rather than assuming a name; set tree.binary in
  # the pathogen config to pin one explicitly.
  - iqtree>=2.2
  - trimal
  - seqkit
  # NCBI command-line tools: esearch/efetch/xtract for ad-hoc GenBank queries,
  # `datasets` for genome/virus packages with metadata
  - entrez-direct
  - ncbi-datasets-cli
  # Nextstrain
  - augur>=24
  - auspice
  # testing and tooling
  - pip
  - pytest
  - pytest-cov
  - mypy
  - conda-lock
  # optional
  - jupyterlab
  - nbformat
  # BEAST2, Tracer, TempEst and FigTree are Java GUI/CLI tools installed
  # separately:
  #   BEAST2  https://www.beast2.org/
  #   Tracer  https://beast.community/tracer
  # Exact versions live in conda-lock.yml (regenerate with
  #   conda-lock lock -f environment.yml -p osx-arm64 -p linux-64).
  # Floors here are intentionally loose. The suite runs on biopython 1.88 and
  # pandas 3.0; tightening these without testing them is how an environment
  # file becomes a lie.
